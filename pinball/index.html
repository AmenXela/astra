<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#07061a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:,">
  <title>Pinball</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #07061a;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Bordet er definert i et logisk koordinatsystem (400 x 720) som skaleres til skjermen.
const W = 400, H = 720, HUD = 48;
const G = 1300;              // tyngdekraft langs bordet (px/s²)
const BALL_R = 9;
const MAX_SPEED = 2600;
const WALL_E = 0.5, FLIP_E = 0.3, BUMPER_KICK = 320, SLING_KICK = 300;
const FLIP_UP_SPEED = 24, FLIP_DOWN_SPEED = 14;
const FLIP_L = 62, FLIP_R0 = 9, FLIP_R1 = 5;
const BALLS_PER_GAME = 3, BALL_SAVE_TIME = 7;
const LANE_X = 350;          // indre vegg i utskytningsrennen

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  scale = Math.min(w / W, h / (H + HUD));
  offX = (w - W * scale) / 2;
  offY = (h - (H + HUD) * scale) / 2 + HUD * scale;
}
window.addEventListener('resize', resize);
resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- Bordet ----------
const walls = [];
function wall(ax, ay, bx, by, opts = {}) {
  const s = { ax, ay, bx, by, rad: opts.rad ?? 2, e: opts.e ?? WALL_E, kick: opts.kick || 0, kind: opts.kind || 'wall', ref: opts.ref || null, hidden: !!opts.hidden };
  walls.push(s);
  return s;
}

// Buen øverst
const arcPts = [];
const ARC_N = 28;
for (let i = 0; i <= ARC_N; i++) {
  const t = Math.PI + Math.PI * i / ARC_N;
  arcPts.push([200 + 180 * Math.cos(t), 200 + 180 * Math.sin(t)]);
}
for (let i = 0; i < ARC_N; i++) wall(arcPts[i][0], arcPts[i][1], arcPts[i + 1][0], arcPts[i + 1][1]);

wall(20, 200, 20, 540);                 // venstre vegg
wall(380, 200, 380, H + 40);            // høyre yttervegg
wall(LANE_X, 230, LANE_X, H + 40);      // rennevegg
wall(LANE_X, 690, 380, 690, { hidden: true }); // stempel (stopper kula i rennen)
wall(20, 540, 104, 611);                // venstre styreskinne mot flipper
wall(LANE_X, 540, 266, 611);            // høyre styreskinne mot flipper

// Envegsport: lukkes når kula har kommet ut på bordet
const gate = { ax: 380, ay: 198, bx: LANE_X, by: 232, rad: 2, e: 0.4, kick: 0, kind: 'gate' };

// Stolper mellom rullebanene øverst
for (const x of [110, 160, 210, 260]) wall(x, 62, x, 98, { rad: 3, kind: 'post' });

// Slyngene (sprettrekanter) over flipperne
const slings = [
  { pts: [[55, 455], [55, 525], [97, 560]], flash: 0 },
  { pts: [[315, 455], [315, 525], [273, 560]], flash: 0 },
];
for (const s of slings) {
  const [a, b, c] = s.pts;
  wall(a[0], a[1], b[0], b[1]);
  wall(b[0], b[1], c[0], c[1]);
  wall(a[0], a[1], c[0], c[1], { kick: SLING_KICK, kind: 'sling', ref: s, e: 0.6 });
}

// Støtfangere
const bumpers = [
  { x: 125, y: 215, r: 24, flash: 0, col: '#ff3d8b' },
  { x: 245, y: 215, r: 24, flash: 0, col: '#ffb000' },
  { x: 185, y: 295, r: 24, flash: 0, col: '#36e0ff' },
];

// Ståmål på sidene
const targets = [];
for (const y of [300, 340, 380]) {
  const t = { x: 24, y, lit: false, flash: 0 };
  targets.push(t);
  wall(25, y - 12, 25, y + 12, { rad: 3, kind: 'target', ref: t, e: 0.4 });
}
for (const y of [300, 340, 380]) {
  const t = { x: 346, y, lit: false, flash: 0 };
  targets.push(t);
  wall(345, y - 12, 345, y + 12, { rad: 3, kind: 'target', ref: t, e: 0.4 });
}

// Rullebaner øverst
const rollovers = [135, 185, 235].map(x => ({ x, y: 82, r: 10, lit: false, inside: false }));

// Flippere
const flippers = [
  { x: 108, y: 615, s: 1, rest: 0.52, up: -0.5, a: 0.52, w: 0, pressed: false },
  { x: 262, y: 615, s: -1, rest: 0.52, up: -0.5, a: 0.52, w: 0, pressed: false },
];

// ---------- Spilltilstand ----------
const ball = { x: 365, y: 680, vx: 0, vy: 0, r: BALL_R, inPlay: false };
let state = 'title';           // 'title' | 'play' | 'over'
let score = 0, ballNo = 1, mult = 1, saveTimer = 0, overTimer = 0;
let charging = false, power = 0, plungerPointer = null;
let message = null;
const popups = [];
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('pinball-hi') || '0', 10) || 0; } catch (e) {}

function saveHi() {
  if (score > hiScore) {
    hiScore = score;
    try { localStorage.setItem('pinball-hi', String(hiScore)); } catch (e) {}
  }
}

function resetBall() {
  ball.x = 365; ball.y = 680; ball.vx = 0; ball.vy = 0; ball.inPlay = false;
  saveTimer = 0;
}

function newGame() {
  score = 0; ballNo = 1; mult = 1;
  for (const t of targets) t.lit = false;
  for (const r of rollovers) r.lit = false;
  popups.length = 0;
  resetBall();
  state = 'play';
  showMessage('Kule 1');
}

function showMessage(text, time = 1.6) { message = { text, t: time }; }

function addScore(pts, x, y) {
  const p = pts * mult;
  score += p;
  if (x !== undefined) popups.push({ x, y, text: String(p), t: 0.8 });
}

function ballReady() {
  return state === 'play' && !ball.inPlay && ball.x > LANE_X && ball.y > 650 && Math.abs(ball.vy) < 80;
}

function launch() {
  if (charging && ballReady()) {
    ball.vy = -(1050 + 1150 * power);
    sfx(140 + power * 200, 0.18, 'sawtooth', 0.06);
  }
  charging = false;
  power = 0;
  plungerPointer = null;
}

function drain() {
  if (saveTimer > 0) {
    resetBall();
    showMessage('Kula reddet!');
    sfx(660, 0.25, 'triangle', 0.08);
    return;
  }
  sfx(110, 0.5, 'sawtooth', 0.07);
  vibrate(120);
  if (ballNo >= BALLS_PER_GAME) {
    saveHi();
    state = 'over';
    overTimer = 0;
    return;
  }
  ballNo++;
  mult = 1;
  resetBall();
  showMessage('Kule ' + ballNo);
}

// ---------- Lyd og vibrasjon ----------
let actx = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) { try { actx = new AC(); } catch (e) { actx = null; } }
}
function sfx(freq, dur = 0.08, type = 'square', vol = 0.05) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.5), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ---------- Fysikk ----------
function collideSeg(s) {
  const dx = s.bx - s.ax, dy = s.by - s.ay;
  const l2 = dx * dx + dy * dy;
  const t = clamp(((ball.x - s.ax) * dx + (ball.y - s.ay) * dy) / l2, 0, 1);
  const px = s.ax + t * dx, py = s.ay + t * dy;
  let nx = ball.x - px, ny = ball.y - py;
  const d = Math.hypot(nx, ny), R = ball.r + s.rad;
  if (d >= R || d < 1e-6) return -1;
  nx /= d; ny /= d;
  ball.x = px + nx * R;
  ball.y = py + ny * R;
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn >= 0) return 0;
  ball.vx -= (1 + s.e) * vn * nx;
  ball.vy -= (1 + s.e) * vn * ny;
  if (s.kick && -vn > 40) { ball.vx += nx * s.kick; ball.vy += ny * s.kick; }
  return -vn;
}

function collideBumper(bp) {
  let nx = ball.x - bp.x, ny = ball.y - bp.y;
  const d = Math.hypot(nx, ny), R = ball.r + bp.r;
  if (d >= R || d < 1e-6) return;
  nx /= d; ny /= d;
  ball.x = bp.x + nx * R;
  ball.y = bp.y + ny * R;
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < 0) {
    ball.vx -= 1.6 * vn * nx;
    ball.vy -= 1.6 * vn * ny;
  }
  ball.vx += nx * BUMPER_KICK;
  ball.vy += ny * BUMPER_KICK;
  bp.flash = 0.15;
  addScore(100, bp.x, bp.y - bp.r - 6);
  sfx(520 + Math.random() * 120, 0.09, 'square', 0.05);
  vibrate(12);
}

function collideFlipper(f) {
  const ca = Math.cos(f.a), sa = Math.sin(f.a);
  const dx = f.s * ca * FLIP_L, dy = sa * FLIP_L;
  const t = clamp(((ball.x - f.x) * dx + (ball.y - f.y) * dy) / (FLIP_L * FLIP_L), 0, 1);
  const px = f.x + t * dx, py = f.y + t * dy;
  const rad = FLIP_R0 + (FLIP_R1 - FLIP_R0) * t;
  let nx = ball.x - px, ny = ball.y - py;
  const d = Math.hypot(nx, ny), R = ball.r + rad;
  if (d >= R || d < 1e-6) return;
  nx /= d; ny /= d;
  ball.x = px + nx * R;
  ball.y = py + ny * R;
  // Hastigheten til flipperens overflate i kontaktpunktet
  const dist = t * FLIP_L;
  const svx = f.w * dist * (-f.s * sa), svy = f.w * dist * ca;
  const vn = (ball.vx - svx) * nx + (ball.vy - svy) * ny;
  if (vn < 0) {
    ball.vx -= (1 + FLIP_E) * vn * nx;
    ball.vy -= (1 + FLIP_E) * vn * ny;
  }
}

function hitWall(s, impact) {
  if (s.kind === 'sling' && impact > 40) {
    s.ref.flash = 0.12;
    addScore(10, ball.x, ball.y - 14);
    sfx(300, 0.07, 'square', 0.05);
    vibrate(10);
  } else if (s.kind === 'target' && impact > 30) {
    const t = s.ref;
    t.flash = 0.2;
    sfx(880, 0.08, 'triangle', 0.06);
    if (!t.lit) {
      t.lit = true;
      addScore(250, t.x + (t.x < 200 ? 22 : -22), t.y);
      if (targets.every(q => q.lit)) {
        addScore(5000);
        showMessage('Alle mål! +' + 5000 * mult);
        for (const q of targets) q.lit = false;
        sfx(990, 0.35, 'triangle', 0.08);
        vibrate([30, 40, 30]);
      }
    } else {
      addScore(50, t.x + (t.x < 200 ? 22 : -22), t.y);
    }
  } else if (impact > 250) {
    sfx(180, 0.04, 'triangle', 0.025);
  }
}

function step(h) {
  for (const f of flippers) {
    const target = f.pressed ? f.up : f.rest;
    const prev = f.a;
    if (f.a > target) f.a = Math.max(target, f.a - FLIP_UP_SPEED * h);
    else if (f.a < target) f.a = Math.min(target, f.a + FLIP_DOWN_SPEED * h);
    f.w = (f.a - prev) / h;
  }

  ball.vy += G * h;
  ball.x += ball.vx * h;
  ball.y += ball.vy * h;

  for (const s of walls) {
    const imp = collideSeg(s);
    if (imp > 0) hitWall(s, imp);
  }
  if (ball.inPlay) collideSeg(gate);
  for (const bp of bumpers) collideBumper(bp);
  for (const f of flippers) collideFlipper(f);

  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED / sp; ball.vy *= MAX_SPEED / sp; }

  if (!ball.inPlay && ball.x < LANE_X - 15) {
    ball.inPlay = true;
    saveTimer = BALL_SAVE_TIME;
  }

  for (const r of rollovers) {
    const inside = Math.hypot(ball.x - r.x, ball.y - r.y) < r.r + 2;
    if (inside && !r.inside && !r.lit) {
      r.lit = true;
      addScore(500, r.x, r.y - 20);
      sfx(760, 0.1, 'sine', 0.07);
      if (rollovers.every(q => q.lit)) {
        for (const q of rollovers) q.lit = false;
        if (mult < 5) { mult++; showMessage('Multiplikator x' + mult); }
        else { addScore(10000); showMessage('Maks! +' + 10000 * mult); }
        sfx(1180, 0.3, 'triangle', 0.08);
        vibrate([20, 30, 20]);
      }
    }
    r.inside = inside;
  }

  if (ball.y > H + 30) drain();
}

function update(dt) {
  for (const bp of bumpers) bp.flash = Math.max(0, bp.flash - dt);
  for (const s of slings) s.flash = Math.max(0, s.flash - dt);
  for (const t of targets) t.flash = Math.max(0, t.flash - dt);
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t -= dt;
    popups[i].y -= 30 * dt;
    if (popups[i].t <= 0) popups.splice(i, 1);
  }
  if (message) { message.t -= dt; if (message.t <= 0) message = null; }

  if (state === 'over') { overTimer += dt; return; }
  if (state !== 'play') return;

  if (ball.inPlay && saveTimer > 0) saveTimer = Math.max(0, saveTimer - dt);
  if (charging) power = Math.min(1, power + dt * 1.2);
  if (charging && !ballReady()) { charging = false; power = 0; plungerPointer = null; }

  const n = Math.ceil(dt / 0.0016);
  const h = dt / n;
  for (let i = 0; i < n && state === 'play'; i++) step(h);
}

// ---------- Kontroller ----------
const pointers = new Map();
function setFlipper(side, on) {
  const f = flippers[side === 'L' ? 0 : 1];
  if (on && !f.pressed && state === 'play') sfx(90, 0.05, 'square', 0.04);
  f.pressed = on;
}
function refreshFlippers() {
  let l = false, r = false;
  for (const side of pointers.values()) { if (side === 'L') l = true; else r = true; }
  setFlipper('L', l || keys.L);
  setFlipper('R', r || keys.R);
}
const keys = { L: false, R: false };

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  if (state !== 'play') return;
  const side = e.clientX < window.innerWidth / 2 ? 'L' : 'R';
  pointers.set(e.pointerId, side);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (side === 'R' && ballReady() && !charging) {
    charging = true; power = 0; plungerPointer = e.pointerId;
  }
  refreshFlippers();
});
function pointerEnd(e) {
  e.preventDefault();
  if (state === 'title' || (state === 'over' && overTimer > 1)) {
    if (e.type === 'pointerup') { pointers.clear(); newGame(); }
    return;
  }
  pointers.delete(e.pointerId);
  if (plungerPointer === e.pointerId) launch();
  refreshFlippers();
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  initAudio();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || k === 'Shift' && e.location === 1) { keys.L = true; refreshFlippers(); }
  else if (k === 'ArrowRight' || k === 'm' || k === 'M' || k === '/' || k === 'Shift' && e.location === 2) { keys.R = true; refreshFlippers(); }
  else if (k === ' ' || k === 'ArrowDown' || k === 'Enter') {
    if (state === 'title' || (state === 'over' && overTimer > 1)) newGame();
    else if (ballReady()) { charging = true; power = 0; plungerPointer = 'key'; }
  } else return;
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || k === 'Shift' && e.location === 1) { keys.L = false; refreshFlippers(); }
  else if (k === 'ArrowRight' || k === 'm' || k === 'M' || k === '/' || k === 'Shift' && e.location === 2) { keys.R = false; refreshFlippers(); }
  else if ((k === ' ' || k === 'ArrowDown' || k === 'Enter') && plungerPointer === 'key') launch();
});

// Pause når appen går i bakgrunnen
let last = performance.now();
document.addEventListener('visibilitychange', () => {
  last = performance.now();
  pointers.clear(); keys.L = keys.R = false; refreshFlippers();
  if (charging) { charging = false; power = 0; plungerPointer = null; }
});

// ---------- Tegning ----------
function glowLine(ax, ay, bx, by, col, width) {
  ctx.strokeStyle = col;
  ctx.globalAlpha = 0.25;
  ctx.lineWidth = width * 3;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
}

function tablePath() {
  ctx.beginPath();
  ctx.moveTo(20, 540);
  ctx.lineTo(20, 200);
  ctx.arc(200, 200, 180, Math.PI, 0);
  ctx.lineTo(380, H);
  ctx.lineTo(20, H);
  ctx.closePath();
}

const bgGrad = (() => {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b1150');
  g.addColorStop(0.55, '#140c3a');
  g.addColorStop(1, '#0b0724');
  return g;
})();

function fmt(n) { return n.toLocaleString('nb-NO'); }

function draw(time) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07061a';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Bordflate
  tablePath();
  ctx.fillStyle = bgGrad;
  ctx.fill();

  // Dekor: stjerner og logo
  ctx.save();
  tablePath();
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 97.3) % 330 + 25, y = (i * 61.7) % 600 + 40;
    ctx.fillRect(x, y, 1.2, 1.2);
  }
  ctx.font = 'bold 34px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(140,120,255,0.16)';
  ctx.fillText('PINBALL', 185, 410);
  ctx.font = 'bold 18px system-ui, -apple-system, sans-serif';
  for (let i = 1; i <= 5; i++) {
    ctx.fillStyle = i <= mult ? '#ffd23f' : 'rgba(255,255,255,0.12)';
    ctx.fillText('x' + i, 105 + i * 27, 450);
  }
  // Lys for kulesparing
  ctx.fillStyle = saveTimer > 0 && (saveTimer > 2 || Math.floor(time / 150) % 2) ? '#3dff9a' : 'rgba(61,255,154,0.12)';
  ctx.beginPath(); ctx.moveTo(185, 672); ctx.lineTo(176, 688); ctx.lineTo(194, 688); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Rullebaner
  for (const r of rollovers) {
    ctx.fillStyle = r.lit ? '#ffd23f' : 'rgba(255,210,63,0.15)';
    ctx.beginPath(); ctx.arc(r.x, r.y, 6, 0, Math.PI * 2); ctx.fill();
  }

  // Vegger
  for (const s of walls) {
    if (s.hidden || s.kind === 'sling' || s.kind === 'target') continue;
    glowLine(s.ax, s.ay, s.bx, s.by, s.kind === 'post' ? '#ffd23f' : '#4ee6ff', s.kind === 'post' ? 5 : 3);
  }
  if (ball.inPlay) glowLine(gate.ax, gate.ay, gate.bx, gate.by, '#ff3d8b', 3);

  // Slynger
  for (const s of slings) {
    const [a, b, c] = s.pts;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.closePath();
    ctx.fillStyle = s.flash > 0 ? '#ffffff' : 'rgba(255,61,139,0.35)';
    ctx.fill();
    ctx.strokeStyle = '#ff3d8b';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Mål
  for (const t of targets) {
    ctx.fillStyle = t.flash > 0 ? '#ffffff' : t.lit ? '#3dff9a' : 'rgba(61,255,154,0.25)';
    ctx.fillRect(t.x < 200 ? t.x - 2 : t.x - 5, t.y - 12, 7, 24);
  }

  // Støtfangere
  for (const bp of bumpers) {
    const f = bp.flash > 0;
    ctx.fillStyle = bp.col;
    ctx.globalAlpha = f ? 0.5 : 0.18;
    ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r + (f ? 8 : 5), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r, 0, Math.PI * 2);
    ctx.fillStyle = f ? '#ffffff' : '#1a1240';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = bp.col;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = bp.col;
    ctx.fill();
  }

  // Flippere
  for (const f of flippers) {
    const tx = f.x + f.s * Math.cos(f.a) * FLIP_L, ty = f.y + Math.sin(f.a) * FLIP_L;
    const nx = -(ty - f.y) / FLIP_L, ny = (tx - f.x) / FLIP_L;
    ctx.beginPath();
    ctx.arc(f.x, f.y, FLIP_R0, 0, Math.PI * 2);
    ctx.moveTo(f.x + nx * FLIP_R0, f.y + ny * FLIP_R0);
    ctx.lineTo(tx + nx * FLIP_R1, ty + ny * FLIP_R1);
    ctx.lineTo(tx - nx * FLIP_R1, ty - ny * FLIP_R1);
    ctx.lineTo(f.x - nx * FLIP_R0, f.y - ny * FLIP_R0);
    ctx.closePath();
    ctx.moveTo(tx + FLIP_R1, ty);
    ctx.arc(tx, ty, FLIP_R1, 0, Math.PI * 2);
    ctx.fillStyle = '#ff8a1f';
    ctx.fill();
    ctx.fillStyle = '#fff1d6';
    ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Stempel
  const pull = charging ? power * 22 : 0;
  ctx.fillStyle = '#7a6cff';
  ctx.fillRect(LANE_X + 9, 692 + pull, 12, H - 692);
  ctx.fillStyle = '#cfc8ff';
  ctx.fillRect(LANE_X + 6, 690 + pull, 18, 4);
  if (charging) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(LANE_X + 4, 470, 22, 160);
    ctx.fillStyle = power > 0.85 ? '#ff3d8b' : '#3dff9a';
    ctx.fillRect(LANE_X + 4, 630 - 160 * power, 22, 160 * power);
  }

  // Kula
  if (state === 'play') {
    const bx = ball.x, by = ball.y + (ballReady() ? pull : 0);
    const g = ctx.createRadialGradient(bx - 3, by - 3, 1, bx, by, ball.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.5, '#c9d2e6');
    g.addColorStop(1, '#5d6680');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, ball.r, 0, Math.PI * 2); ctx.fill();
  }

  // Poengsprett
  ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.t / 0.8, 0, 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // Topplinje
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#9d93d9';
  ctx.font = '600 11px system-ui, -apple-system, sans-serif';
  ctx.fillText('POENG', 20, -36);
  ctx.textAlign = 'right';
  ctx.fillText('REKORD', 380, -36);
  ctx.textAlign = 'center';
  ctx.fillText('KULE', 200, -36);
  ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.fillText(fmt(score), 20, -16);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText(fmt(Math.max(hiScore, score)), 380, -16);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(state === 'play' ? ballNo + '/' + BALLS_PER_GAME : '–', 200, -16);

  // Melding
  if (message && state === 'play') {
    ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(7,6,26,0.7)';
    const w = ctx.measureText(message.text).width + 28;
    ctx.fillRect(185 - w / 2, 500, w, 36);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText(message.text, 185, 519);
  }
  if (state === 'play' && ballReady() && !charging) {
    ctx.font = '600 13px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.35 * Math.sin(time / 250)) + ')';
    ctx.fillText('Hold høyre side for å skyte ut kula', 185, 380);
  }

  // Start- og sluttskjerm
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(7,6,26,0.78)';
    ctx.fillRect(0, -HUD, W, H + HUD);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 44px system-ui, -apple-system, sans-serif';
    ctx.fillText(state === 'title' ? 'PINBALL' : 'GAME OVER', 200, 220);
    ctx.font = '16px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#cfc8ff';
    if (state === 'over') {
      ctx.fillText('Poeng: ' + fmt(score), 200, 275);
      ctx.fillText(score >= hiScore && score > 0 ? 'Ny rekord!' : 'Rekord: ' + fmt(hiScore), 200, 302);
    } else {
      ctx.fillText('Trykk på venstre eller høyre side', 200, 275);
      ctx.fillText('av skjermen for å bruke flipperne.', 200, 298);
      ctx.fillText('Hold høyre side inne for å spenne', 200, 332);
      ctx.fillText('stempelet, slipp for å skyte.', 200, 355);
      ctx.fillStyle = '#9d93d9';
      ctx.font = '14px system-ui, -apple-system, sans-serif';
      ctx.fillText('Tre rullebaner øverst gir høyere multiplikator.', 200, 395);
      ctx.fillText('Treff alle seks grønne mål for bonus.', 200, 416);
    }
    if (state === 'title' || overTimer > 1) {
      ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,210,63,' + (0.6 + 0.4 * Math.sin(time / 300)) + ')';
      ctx.fillText(state === 'title' ? 'Trykk for å starte' : 'Trykk for å spille igjen', 200, 480);
    }
  }
}

function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
